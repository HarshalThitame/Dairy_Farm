      operationId: COW_API_001
      summary: "List cow records with pagination, filtering, sorting and search."
      description: "farm access; pagination max 100"
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
