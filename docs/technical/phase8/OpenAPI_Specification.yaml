        - Farm Management
      operationId: FARM_API_004
      summary: "Update farm profile and location."
      description: "owner/admin only; location master validation"
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
