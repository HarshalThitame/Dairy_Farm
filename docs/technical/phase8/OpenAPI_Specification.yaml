      tags:
        - Farm Management
      operationId: FARM_API_003
      summary: "Get farm profile."
      description: "farm access required"
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
