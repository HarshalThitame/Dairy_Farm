        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
        - Farm Management
      operationId: FARM_API_005
      summary: "Protected farm deletion request."
      description: "owner/admin; confirmation; backup recommended"
      parameters:
        - name: farmId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
