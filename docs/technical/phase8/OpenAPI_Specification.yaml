        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
  "/v1/auth/pin/login":
    post:
      tags:
        - Authentication
      operationId: AUTH_API_003
      summary: "Unlock active app session using PIN."
      description: "4+ digit PIN; rate limited"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        "200":
