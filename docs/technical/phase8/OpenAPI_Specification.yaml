openapi: 3.1.0
info:
  title: Majhi Dairy API
  version: 1.0.0
  description: API contract for Majhi Dairy frontend, Supabase backend, AI, OCR and admin integrations.
servers:
  - url: https://api.majhidairy.app
    description: Production API base
  - url: http://localhost:3000
    description: Local Next.js API base
security:
  - bearerAuth: []
tags:
  - name: AI Assistant
  - name: Accounting
  - name: Achievements
  - name: Admin
  - name: Authentication
  - name: Calf Management
  - name: Cow Management
  - name: Farm Management
  - name: Notifications
  - name: OCR
  - name: Records Management
  - name: Reminders
  - name: Reports
  - name: Settings
  - name: Support
paths:
  "/v1/auth/signup":
    post:
      tags:
        - Authentication
      operationId: AUTH_API_001
      summary: "Create user, profile, first farm and language onboarding state."
      description: "name plus email or phone required; password policy; language mr/en"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/ValidationFailed'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
  "/v1/auth/login":
    post:
      tags:
        - Authentication
      operationId: AUTH_API_002
      summary: "Authenticate by email/phone and password."
      description: "identifier and password required"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericRequest'
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
