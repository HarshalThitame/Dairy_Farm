        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
    get:
      tags:
        - Farm Management
      operationId: FARM_API_002
      summary: "List farms accessible to current user."
      description: "pagination limits"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
